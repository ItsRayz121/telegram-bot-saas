<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b1a" />
  <title>Telegizer - Offline</title>
  <!-- Fully self-contained: no external fonts, images or scripts. The service worker precaches this file. -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(ellipse at 50% 30%,#1f1b4d 0%,#0b0b1a 70%);color:#f1f0ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
    h1{font-size:1.5rem;font-weight:700}
    p{color:#a5a3d6}
    button{background:#6d5dfc;color:#fff;border:0;border-radius:10px;padding:10px 28px;font-size:.95rem;font-weight:600;cursor:pointer;min-height:44px;visibility:hidden}
    button.show{visibility:visible}
    button:disabled{opacity:.6;cursor:default}
    button:focus-visible{outline:2px solid #a5b4fc;outline-offset:2px}
    .f{animation:f 6s ease-in-out infinite}.l{animation:l 4s ease-in-out infinite;transform-origin:196px 52px}.w{animation:p 2.4s ease-in-out infinite}.w2{animation-delay:.2s}.w3{animation-delay:.4s}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes l{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.f,.l,.w{animation:none}}
  </style>
</head>
<body>
  <svg width="240" height="192" viewBox="0 0 240 192" role="img" aria-label="Astronaut waiting for a signal" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4a8a"/><stop offset="1" stop-color="#25234a"/></linearGradient>
      <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f0ff"/><stop offset="1" stop-color="#c4c2ee"/></linearGradient>
      <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    </defs>
    <ellipse cx="120" cy="178" rx="92" ry="9" fill="#000" opacity=".25"/>
    <path d="M32 176c4-30 36-44 88-44s84 14 88 44z" fill="url(#m)"/>
    <g class="f">
      <rect x="92" y="94" width="40" height="42" rx="16" fill="url(#s)"/>
      <rect x="104" y="108" width="16" height="8" rx="3" fill="url(#a)"/>
      <rect x="96" y="130" width="14" height="26" rx="7" fill="#b9b6e8"/><rect x="114" y="130" width="14" height="26" rx="7" fill="#aeabe0"/>
      <circle cx="112" cy="76" r="22" fill="url(#s)"/><rect x="98" y="66" width="28" height="20" rx="10" fill="#1b1a3a"/>
      <path d="M128 104c10-2 18-8 24-14" stroke="#d9d7f7" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M150 92L196 52" stroke="#8b8fc7" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g class="l"><path d="M196 52c6 20 4 44-6 62" stroke="#a5b4fc" stroke-width="1" fill="none" opacity=".8"/></g>
    <g transform="translate(190 108)" fill="none" stroke="url(#a)" stroke-width="2.4" stroke-linecap="round">
      <path class="w" d="M-9 -3a13 13 0 0 1 18 0"/><path class="w w2" d="M-5.5 1a8 8 0 0 1 11 0"/><path class="w w3" d="M-2 5a3 3 0 0 1 4 0"/>
    </g>
  </svg>
  <h1>You're Offline</h1>
  <p id="st" aria-live="polite">Reconnecting&hellip;</p>
  <button id="b" type="button">Try Again</button>
  <script>
    // Real connectivity check against our own origin; only navigates once it succeeds.
    var b=document.getElementById('b'),st=document.getElementById('st'),busy=false;
    function check(){
      if(busy)return;busy=true;b.disabled=true;
      var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);
      fetch('/manifest.json?_probe='+Date.now(),{cache:'no-store',signal:c.signal})
        .then(function(r){if(!r.ok)throw 0;location.replace('/')})
        .catch(function(){st.textContent='Still offline. Reconnecting…'})
        .then(function(){clearTimeout(t);setTimeout(function(){busy=false;b.disabled=false},3000)});
    }
    b.addEventListener('click',check);
    window.addEventListener('online',check);
    setTimeout(function(){b.className='show'},8000);
    setInterval(function(){if(document.visibilityState==='visible')check()},20000);
  </script>
</body>
</html>
