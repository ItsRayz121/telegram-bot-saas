<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1030" />
  <title>Telegizer - Offline</title>
  <!-- Fully self-contained: no external fonts, images or scripts. The service worker precaches this file. -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(110% 80% at 50% 20%,#14275e 0%,#0a1030 55%,#060818 100%);color:#f3f2ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
    svg{max-width:100%;height:auto;overflow:visible}
    h1{font-size:1.55rem;font-weight:700;letter-spacing:-.3px;margin-top:6px}
    #st{color:#9d9bd0;font-size:.95rem}
    .sub{font-size:.75rem;color:#6f6da8}
    button{margin-top:10px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 24px;border-radius:12px;border:1px solid rgba(167,155,255,.35);background:linear-gradient(180deg,rgba(139,92,246,.28),rgba(139,92,246,.12));color:#efeaff;font:600 .9rem -apple-system,'Segoe UI',sans-serif;cursor:pointer;visibility:hidden}
    button.show{visibility:visible}
    button:hover{border-color:rgba(190,175,255,.7)}
    button:disabled{opacity:.7;cursor:default}
    button:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
    .sp{display:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:s .8s linear infinite}
    button.busy .sp{display:inline-block}
    @keyframes s{to{transform:rotate(360deg)}}
    .g{animation:g 2.6s ease-in-out infinite}
    .r{transform-box:fill-box;transform-origin:center;animation:r 3.2s ease-out infinite;opacity:0}.r2{animation-delay:1.05s}.r3{animation-delay:2.1s}
    .t{animation:t 5s ease-in-out infinite}
    @keyframes g{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes r{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes t{0%,100%{opacity:.2}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.g,.r,.t,.sp{animation:none}.r{opacity:.35}}
  </style>
</head>
<body>
  <svg width="340" height="283" viewBox="0 0 360 300" role="img" aria-label="Signal tower searching for a connection" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#4b3fd0"/></linearGradient>
      <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
      <radialGradient id="c"><stop offset="0" stop-color="#7aa2ff" stop-opacity=".6"/><stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
      <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff" stop-opacity="0"/><stop offset="1" stop-color="#5b8cff" stop-opacity=".35"/></linearGradient>
      <linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      <mask id="m"><rect x="-80" y="224" width="520" height="76" fill="url(#e)"/></mask>
    </defs>
    <g fill="#cfd8ff"><circle class="t" cx="40" cy="60" r="1.1"/><circle class="t" style="animation-delay:1.2s" cx="320" cy="48" r="1.1"/><circle class="t" style="animation-delay:2.4s" cx="70" cy="140" r="1.1"/><circle class="t" style="animation-delay:.6s" cx="300" cy="130" r="1.1"/><circle class="t" style="animation-delay:1.8s" cx="250" cy="24" r="1.1"/></g>
    <g mask="url(#m)" stroke="#5b8cff" stroke-opacity=".5" fill="none">
      <path d="M-80 232H440M-80 246H440M-80 264H440M-80 288H440"/>
      <path d="M180 224L-60 300M180 224L10 300M180 224L90 300M180 224L180 300M180 224L270 300M180 224L350 300M180 224L420 300"/>
    </g>
    <ellipse cx="180" cy="228" rx="90" ry="12" fill="url(#d)"/>
    <g transform="translate(180 62)">
      <circle r="60" fill="url(#c)" class="g"/>
      <circle class="r" r="24" fill="none" stroke="#7aa2ff" stroke-width="1.6"/>
      <circle class="r r2" r="24" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
      <circle class="r r3" r="24" fill="none" stroke="#c084fc" stroke-width="1.4"/>
    </g>
    <g stroke="url(#a)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M180 66L142 228M180 66L218 228"/>
      <path d="M168.4 119H191.6M160.8 153H199.2M153.5 187H206.5M146 221H214"/>
      <path d="M168.4 119L199.2 153M191.6 119L160.8 153M160.8 153L206.5 187M199.2 153L153.5 187M153.5 187L214 221M206.5 187L146 221" stroke-width="1.4" stroke-opacity=".7"/>
    </g>
    <path d="M132 228h96" stroke="#7aa2ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="180" cy="62" r="7" fill="#0b1030" stroke="url(#b)" stroke-width="2.4"/><circle class="g" cx="180" cy="62" r="2.8" fill="#c4b5fd"/>
    <path d="M180 55V44" stroke="url(#a)" stroke-width="2.4" stroke-linecap="round"/>
    <g class="g"><rect x="228" y="108" width="78" height="26" rx="13" fill="#0e1538" stroke="#5b8cff" stroke-opacity=".4"/><circle cx="244" cy="121" r="4" fill="#ef4444"/><rect x="254" y="118" width="40" height="6" rx="3" fill="#7e8bd8" opacity=".6"/></g>
    <g class="g" style="animation-delay:1.2s"><rect x="54" y="148" width="64" height="26" rx="13" fill="#0e1538" stroke="#a78bfa" stroke-opacity=".4"/><circle cx="70" cy="161" r="4" fill="#f59e0b"/><rect x="80" y="158" width="28" height="6" rx="3" fill="#7e8bd8" opacity=".6"/></g>
  </svg>
  <h1>You're Offline</h1>
  <p id="st" aria-live="polite">Reconnecting&hellip;</p>
  <button id="b" type="button"><span class="sp"></span>Try Again</button>
  <p class="sub">Your bots keep running on our servers.</p>
  <script>
    // Real connectivity check against our own origin; only navigates once it succeeds.
    var b=document.getElementById('b'),st=document.getElementById('st'),busy=false;
    function check(){
      if(busy)return;busy=true;b.disabled=true;b.className='show busy';
      var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);
      fetch('/manifest.json?_probe='+Date.now(),{cache:'no-store',signal:c.signal})
        .then(function(r){if(!r.ok)throw 0;location.replace('/')})
        .catch(function(){st.textContent='Still offline. Reconnecting…'})
        .then(function(){clearTimeout(t);setTimeout(function(){busy=false;b.disabled=false;b.className='show'},3000)});
    }
    b.addEventListener('click',check);
    window.addEventListener('online',check);
    setTimeout(function(){if(!busy)b.className='show'},8000);
    setInterval(function(){if(document.visibilityState==='visible')check()},20000);
  </script>
</body>
</html>
